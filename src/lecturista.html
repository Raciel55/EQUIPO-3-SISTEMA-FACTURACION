<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style/style-dashboard.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #009966">
        <div class="container-fluid">

            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="../img/cfe.png" alt="Logo" width="40" height="40" class="me-2 rounded">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <!-- MENU ITEMS -->
                <ul class="navbar-nav ms-0 mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Bienvenido Lecturista</a>
                    </li>
                </ul>

                <!-- SPACER TO PUSH EXIT TO THE RIGHT -->
                <div class="ml-auto"></div>

                <!-- EXIT BUTTON -->
                <a href="./index.html" class="btn btn-outline-light">
                    Cerrar Sesión
                </a>

            </div>
        </div>
    </nav>
    <p class="h2 text-center mt-3">Captura de Consumo</p>

    <div class="card-body w-75 mx-auto mt-4">

        <form>
            <p class="text-muted">Busca el Número de Servicio.
            </p>
            <div class="card">
                <div class="row mb-3 p-3">
                    <div class="col-md-6">
                        <label class="font-weight-bold">No. Servicio</label>
                        <input type="text" class="form-control" placeholder="">
                    </div>
                    <div class="col-md-6 mt-4">
                        <div class="btn btn-primary">BUSCAR</div>
                    </div>
                </div>
            </div>
            <p class="text-muted mt-3">Datos del Servicio</p>

            <div class="card">
                <div class="row mb-3 p-3">
                    <div class="col-md-6">
                        <label class="font-weight-bold">Nombre del Cliente</label>
                        <input type="text" class="form-control" placeholder="" disabled value="JUAN PEREZ PEREZ">
                    </div>
                    <div class="col-md-6">
                        <label class="font-weight-bold">Domicilio</label>
                        <input type="text" class="form-control" placeholder="" disabled value="AV. PRINCIPAL #123, COL. CONDESA, CDMX">
                    </div>
                </div>
            </div>
            <p class="text-muted mt-3">Lectura Anterior</p>
            <div class="card">
                <div class="row mb-3 p-3">
                    <div class="col-md-6">
                        <label class="font-weight-bold">Fecha de Lectura Anterior</label>
                        <input type="text" class="form-control" placeholder="" disabled value="2025-09-16">
                    </div>
                    <div class="col-md-6">
                        <label class="font-weight-bold">Consumo</label>
                        <input type="text" class="form-control" placeholder="" disabled value="350">
                    </div>
                    <div class="col-md-6">
                        <label class="font-weight-bold">Consumo Historico</label>
                        <input type="text" class="form-control" placeholder="" disabled value="11500">
                    </div>
                </div>
            </div>

            <p class="text-muted mt-3">Captura la Lectura Actual y menciona anomalias de ser necesario.</p>
            <div class="card">
                <div class="row mb-3 p-3">
                    <div class="col-md-6">
                        <label class="font-weight-bold">Consumo</label>
                        <input type="text" class="form-control" placeholder="">
                    </div>
                    <div class="col-md-6">
                        <label class="font-weight-bold">Fecha</label>
                        <input type="date" value="2025-11-16" class="form-control" placeholder="" disabled>
                    </div>
                    <div class="col-md-6 mt-3">
                        <div class="form-floating">
                            <label class="font-weight-bold">Observaciones</label>
                            <textarea class="form-control" placeholder="Leave a comment here"
                                id="floatingTextarea"></textarea>
                        </div>
                    </div>
                </div>
                <div class="container mb-5">
                    <div class="text-center">
                        <div class="btn" style="background-color: #009966; color: white;">GUARDAR LECTURA</div>
                    </div>
                </div>
            </div>


        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
</body>

</html>
