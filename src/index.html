<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login CFE</title>

    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style/style-login.css">
    <link rel="icon" type="image/png" href="../img/cfe.png">
</head>

<body>

    <div class="login-card">
        <img src="../img/cfe.png" alt="Logo CFE">

        <h1 class="text-center mt-4">BIENVENIDO</h1>

        <form class="mt-4">

            <div class="form-group">
                <label for="correo" class="font-weight-bold">Correo Electrónico</label>
                <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group mt-3">
                <label for="password" class="font-weight-bold">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="********">
            </div>

            <p class="registro mt-3">¿Aún no tienes una cuenta?
                <a href="#">Regístrate</a>
            </p>

            <div class="text-center mt-4">
                <button class="btn-cfe">
                    <a href="./dashboard.html" class="text-white text-decoration-none">
                        Ingresar
                    </a>
                </button>

            </div>

        </form>
    </div>

</body>

</html>
