<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login CFE</title>

    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style/style-login.css">
    <link rel="icon" type="image/png" href="../img/cfe.png">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #009966">
        <div class="container-fluid">

            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="../img/cfe.png" alt="Logo" width="40" height="40" class="me-2 rounded">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <!-- MENU ITEMS -->
                <ul class="navbar-nav ms-0 mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Log In</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./dashboard.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./informacion.html">Mi Información</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./generar.html">Generar Factura</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./consumo.html">Consumo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./admin.html">Administración</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./usuarios.html">Gestión de Usuarios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./rutas.html">Planificación de Rutas</a>
                    </li>
                </ul>


                <!-- SPACER TO PUSH EXIT TO THE RIGHT -->
                <div class="ml-auto"></div>

            </div>
        </div>
    </nav>

    <div class="login-card">
        <img src="../img/cfe.png" alt="Logo CFE">

        <h1 class="text-center mt-4">BIENVENIDO</h1>

        <form class="mt-4">

            <div class="form-group">
                <label for="correo" class="font-weight-bold">Correo Electrónico</label>
                <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group mt-3">
                <label for="password" class="font-weight-bold">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="********">
            </div>

            <p class="registro mt-3">¿Aún no tienes una cuenta?
                <a href="#">Regístrate</a>
            </p>

            <div class="text-center mt-4">
                <button class="btn-cfe">
                    <a href="./dashboard.html" class="text-white text-decoration-none">
                        Ingresar
                    </a>
                </button>

            </div>

        </form>
    </div>

</body>

</html>
