<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style/style.css">
</head>

<body>
    <div class="card container-fluid mt-5" style="width: 70vh; border-radius: 20px;">
        <div class="img-fluid text-right">
            <img src="../img/cfe.png" alt="" srcset="">
        </div>
        <h1 class="text-center mt-5" style="color: #009966;">BIENVENIDO</h1>
        <div class="container container-fluid mt-5" style="width: 60vh;">
            <form>
                <div class="form-group">
                    <label for="exampleInputEmail1">Correo</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                </div>
                <div class="form-group">
                    <label for="exampleInputPassword1">Contraseña </label>
                    <input type="password" class="form-control" id="exampleInputPassword1">
                </div>

                <div class="text-center mt-5">

                    <button type="submit" class="btn mb-5" style="width: 20vh; height: 7vh; background-color: #009966; color: white;">Ingresar</button>

                </div>


                <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
                    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
                    crossorigin="anonymous"></script>

            </form>
        </div>

    </div>
</body>

</html>
